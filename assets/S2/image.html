<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../pipeline/brand.css">
<style>
body{background:#FBFAF7}
body::before{content:"";position:absolute;inset:0;background:url(../../pipeline/speckle-lav.svg) 0 0/1080px 1350px no-repeat}
body::after{content:"";position:absolute;inset:0;opacity:.10;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:1;height:1350px;padding:0 96px 110px;display:flex;flex-direction:column;justify-content:center}
.logo{top:60px;right:70px}
.id{display:flex;align-items:center;gap:26px}
.av{width:150px;height:150px;border-radius:50%;border:5px solid #5600EF;background:#e9e9ee url(../../brand/assets/photos/srinath-face.jpg) center/cover no-repeat;box-shadow:0 10px 30px -12px rgba(86,0,239,.5)}
.nm{font-family:var(--display);font-weight:800;font-size:38px;color:#5600EF;letter-spacing:-.01em}
.hd{font-family:var(--alt);font-weight:600;font-size:23px;letter-spacing:.08em;color:#6b6b78;margin-top:6px;text-transform:uppercase}
blockquote{margin-top:56px;font-family:var(--body);font-weight:500;font-size:67px;line-height:1.28;letter-spacing:-.015em;color:#141414}
blockquote em{font-style:normal;color:#FE0079}
.foot{position:absolute;left:96px;bottom:70px;font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.12em;color:#3a3a46;text-transform:uppercase}
</style></head>
<body data-h="1350"><div class="wrap">
  <div class="logo"><img src="../../brand/assets/bighammer-logo-dark.svg"></div>
  <div class="id"><div class="av"></div><div><div class="nm">Srinath Reddy - Founder &amp; CEO</div></div></div>
  <blockquote>If a savings number can’t tell you what was measured and what was assumed, it isn’t a number. <em>It’s a pitch.</em></blockquote>
</div></body></html>
